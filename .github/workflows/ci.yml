name: Validate starter
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package.json'
      - name: Install dependencies
        # Commit package-lock.json after the first online install and switch to npm ci.
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests, build and validate output
        run: npm run build
